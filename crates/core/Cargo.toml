[package]
name = "rustnior-core"
description = "Image loading, caching, folder scanning and transforms for rustnior"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
fast_image_resize = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "pnm", "qoi", "hdr", "exr", "dds", "ff"] }
jxl-oxide = { version = "0.12.6", optional = true }
kamadak-exif = "0.6.2"
libheif-rs = { version = "3.0.0", optional = true, default-features = false, features = ["v1_17"] }
md-5 = "0.11.0"
png = "0.18"
resvg = { version = "0.50.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror.workspace = true
toml = "1.2.1"
tracing.workspace = true
turbojpeg = { version = "1.5.1", default-features = false, features = ["pkg-config"], optional = true }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"


[features]
default = ["svg"]
svg = ["dep:resvg"]
# libjpeg-turbo (system library): DCT-scaled JPEG previews and faster decoding.
turbojpeg = ["dep:turbojpeg"]
# JPEG XL via the pure-Rust jxl-oxide.
jxl = ["dep:jxl-oxide"]
# HEIC/HEIF and AVIF via the system libheif (>= 1.17).
heif = ["dep:libheif-rs"]

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false
